services:
  pocket-id:
    image: pocketid/pocket-id:v2.13.0
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      - TZ=${TZ}
      - APP_URL=${POCKET_ID_APP_URL}
      - ENCRYPTION_KEY=${POCKET_ID_ENCRYPTION_KEY}
      - TRUST_PROXY=${POCKET_ID_TRUST_PROXY}
      - PUID=${UID}
      - PGID=${GID}
    healthcheck:
      test:
        - CMD
        - /app/pocket-id
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    x-runtipi:
      is_main: true
      internal_port: 1411

x-runtipi:
  schema_version: 2
