services:
  postgresql:
    image: postgres:18.6
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/postgresql
    environment:
      # Use DB_* form vars — do not interpolate ${POSTGRES_PASSWORD}.
      # Runtipi's process env / root .env also define POSTGRES_* for the
      # internal Tipi database; Compose prefers those over app.env and would
      # initialize this container with the wrong password.
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=${TZ}
      - PGTZ=${TZ}
    shm_size: 256mb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    x-runtipi:
      is_main: true
      internal_port: 5432

x-runtipi:
  schema_version: 2
