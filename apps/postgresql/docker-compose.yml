services:
  postgresql:
    image: postgres:18.6
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=${TZ}
      - PGTZ=${TZ}
    shm_size: 256mb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    x-runtipi:
      is_main: true
      internal_port: 5432

x-runtipi:
  schema_version: 2
