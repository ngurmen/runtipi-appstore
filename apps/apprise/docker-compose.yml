services:
  apprise:
    image: caronc/apprise:1.5.1
    user: '1000'
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/plugin:/plugin
      - ${APP_DATA_DIR}/data/attach:/attach
    environment:
      - TZ=${TZ}
      - APPRISE_STATEFUL_MODE=${APPRISE_STATEFUL_MODE}
      - APPRISE_WORKER_COUNT=${APPRISE_WORKER_COUNT}
    x-runtipi:
      is_main: false
      internal_port: 8000

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - apprise
    environment:
      - APPRISE_API_KEY=${APPRISE_API_KEY}
      - NGINX_ENVSUBST_FILTER=APPRISE_API_KEY
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        mkdir -p /etc/nginx/templates
        cat > /etc/nginx/templates/default.conf.template << 'EOF'
        server {
            listen 80;
            server_name _;

            client_max_body_size 10m;

            # Protected paths requiring API key
            location ~ ^/(notify|add|get|del|cfg)(/.*)?$ {
                if ($http_x_api_key = "") {
                    return 401;
                }

                set $api_key_valid 0;
                if ($http_x_api_key = "$APPRISE_API_KEY") {
                    set $api_key_valid 1;
                }

                if ($api_key_valid = 0) {
                    return 401;
                }

                if ($request_method !~ ^(GET|POST)$) {
                    return 405;
                }

                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Host $host;

                proxy_http_version 1.1;
                proxy_set_header Connection "";

                proxy_pass http://apprise:8000;
            }

            location / {
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Host $host;

                proxy_http_version 1.1;
                proxy_set_header Connection "";

                proxy_pass http://apprise:8000;
            }
        }
        EOF
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    x-runtipi:
      is_main: true
      internal_port: 80

x-runtipi:
  schema_version: 2
